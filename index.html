  <title>Mohammed Abdul Rafay - Personal Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      line-height: 1.6;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Canvas for Mouse Cursor Trail VFX */
    #vfx-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    /* Full-Screen Animation Container */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    /* Faster Ambient Floating Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.5;
      animation: float-fast 6s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: #00d2ff;
      top: -50px;
      left: -50px;
    }

    .orb-2 {
      width: 500px;
      height: 500px;
      background: #7928ca;
      bottom: -100px;
      right: -50px;
      animation-delay: -2s;
      animation-duration: 8s;
    }

    .orb-3 {
      width: 350px;
      height: 350px;
      background: #ff0080;
      top: 35%;
      left: 45%;
      animation-delay: -4s;
      animation-duration: 7s;
    }

    @keyframes float-fast {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
      50% {
        transform: translate(180px, 120px) scale(1.25) rotate(180deg);
      }
      100% {
        transform: translate(-120px, 200px) scale(0.85) rotate(360deg);
      }
    }

    /* Fast Starry Lights & Particle VFX */
    .star {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      opacity: 0;
      box-shadow: 0 0 8px #38bdf8, 0 0 12px #ffffff;
      animation: twinkle-fast 1.8s infinite ease-in-out;
    }

    @keyframes twinkle-fast {
      0% {
        opacity: 0.1;
        transform: scale(0.4) translateY(0);
      }
      50% {
        opacity: 1;
        transform: scale(1.6) translateY(-15px);
        box-shadow: 0 0 15px #38bdf8, 0 0 25px #ffffff;
      }
      100% {
        opacity: 0.1;
        transform: scale(0.4) translateY(-30px);
      }
    }

    /* Container for Layout */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Header Styling with VFX Glow */
    header {
      text-align: center;
      padding: 40px 0;
    }

    header h1 {
      font-size: 2.8rem;
      margin-bottom: 8px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.8), 0 0 40px rgba(121, 40, 202, 0.6);
      letter-spacing: 1px;
    }

    header p {
      font-size: 1.2rem;
      color: #cbd5e1;
    }

    /* Gallery Section */
    .gallery-section {
      margin: 40px 0;
    }

    .gallery-section h2 {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    /* Gallery Card with Glassmorphism & Hover VFX */
    .gallery-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .gallery-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(56, 189, 248, 0.8);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4), 0 12px 20px -5px rgba(0, 0, 0, 0.5);
    }

    .gallery-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .gallery-card:hover img {
      transform: scale(1.06);
    }

    /* Contact Section */
    .contact-section {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 35px;

      text-align: center;

    }

  <!-- Cursor Particle Trail VFX Script -->
  <script>
    const canvas = document.getElementById('vfx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('mousemove', (e) => {
      for (let i = 0; i < 3; i++) {
        particles.push({
          x: e.clientX,
          y: e.clientY,
          size: Math.random() * 4 + 1,
          speedX: (Math.random() - 0.5) * 3,
          speedY: (Math.random() - 0.5) * 3,
          color: `hsl(${Math.random() * 60 + 190}, 100%, 70%)`,
          life: 1
        });
      }
    });

    function animateVFX() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        p.x += p.speedX;
        p.y += p.speedY;
        p.life -= 0.025;

        if (p.life <= 0) {
          particles.splice(i, 1);
          i--;
        }
      }
      requestAnimationFrame(animateVFX);
    }
    animateVFX();
  </script>
