<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mohammed Abdul Rafay - Personal Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Floating Illusion Background */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      animation: float 20s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 450px;
      height: 450px;
      background: #38bdf8;
      top: -100px;
      left: -100px;
    }

    .orb-2 {
      width: 550px;
      height: 550px;
      background: #6366f1;
      bottom: -150px;
      right: -100px;
      animation-delay: -5s;
      animation-duration: 25s;
    }

    .orb-3 {
      width: 350px;
      height: 350px;
      background: #0284c7;
      top: 40%;
      left: 50%;
      animation-delay: -10s;
      animation-duration: 22s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(120px, 90px) scale(1.1);
      }
      100% {
        transform: translate(-80px, 160px) scale(0.9);
      }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      padding: 40px 0;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    header p {
      font-size: 1.1rem;
      color: #94a3b8;
    }

    .gallery-section {
      margin: 40px 0;
    }

    .gallery-section h2 {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 2px solid #334155;
      padding-bottom: 10px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .gallery-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .gallery-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.25);
    }

    .gallery-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .contact-section {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      margin-top: 50px;
    }

    .contact-section h2 {
      margin-bottom: 12px;
      color: #38bdf8;
    }

    .contact-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .contact-links a {
      color: #f8fafc;
      text-decoration: none;
      background: #334155;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .contact-links a:hover {
      background: #0284c7;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>
